<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>vzMusic — офлайн</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #09090b; color: #fafafa; font: 15px -apple-system, system-ui, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  body { padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 120px); }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  p.sub { color: #a1a1aa; margin: 0 0 20px; font-size: 13px; }
  button.retry { background: #fafafa; color: #09090b; border: 0; border-radius: 12px; height: 40px; padding: 0 16px; font-weight: 600; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  li img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #18181b; }
  li .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .a { color: #a1a1aa; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .m { min-width: 0; flex: 1; }
  li.on .t { color: #fff; } li.on { background: #18181b; border-radius: 10px; padding: 8px; margin: 0 -8px; }
  .bar { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); background: #111113; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 12px; display: none; align-items: center; gap: 10px; }
  .bar .m { flex: 1; min-width: 0; } .bar button { background: none; border: 0; color: #fafafa; font-size: 22px; width: 40px; height: 40px; }
  .empty { color: #71717a; font-size: 14px; margin-top: 24px; }
</style>
</head>
<body>
  <h1>Нет соединения</h1>
  <p class="sub">Сайт vzMusic недоступен. Скачанные треки можно слушать прямо здесь.</p>
  <button class="retry" onclick="retry()">Попробовать снова</button>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>Скачанных треков нет.</div>
  <div class="bar" id="bar">
    <div class="m"><div class="t" id="nt"></div><div class="a" id="na"></div></div>
    <button onclick="prev()">⏮</button><button id="pp" onclick="toggle()">⏸</button><button onclick="next()">⏭</button>
  </div>
  <audio id="au" playsinline></audio>
<script>
  // Plain script: this page lives inside the app and must work with no network at all.
  var C = window.Capacitor, FS = C && C.Plugins && C.Plugins.Filesystem;
  var items = [], base = "", cur = -1, au = document.getElementById("au");
  function retry() { location.href = (window.__vzServer || "https://vzmusic.vercel.app"); }
  function src(id) { return C.convertFileSrc(base + "/vz/dl/" + id + ".m4a"); }
  function render() {
    var ul = document.getElementById("list"); ul.innerHTML = "";
    items.forEach(function (t, i) {
      var li = document.createElement("li"); if (i === cur) li.className = "on";
      li.innerHTML = '<img alt=""><div class="m"><div class="t"></div><div class="a"></div></div>';
      li.querySelector("img").src = t.cover || ""; li.querySelector("img").onerror = function () { this.style.visibility = "hidden"; };
      li.querySelector(".t").textContent = t.title; li.querySelector(".a").textContent = t.artist;
      li.onclick = function () { play(i); }; ul.appendChild(li);
    });
    document.getElementById("empty").hidden = items.length > 0;
  }
  function play(i) {
    if (!items.length) return; cur = (i + items.length) % items.length; var t = items[cur];
    au.src = src(t.id); au.play();
    document.getElementById("bar").style.display = "flex";
    document.getElementById("nt").textContent = t.title; document.getElementById("na").textContent = t.artist;
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: t.cover ? [{ src: t.cover, sizes: "544x544" }] : [] });
    }
    render();
  }
  function next() { play(cur + 1); } function prev() { play(cur - 1); }
  function toggle() { if (au.paused) au.play(); else au.pause(); }
  au.onended = next;
  au.onplay = function () { document.getElementById("pp").textContent = "⏸"; };
  au.onpause = function () { document.getElementById("pp").textContent = "▶"; };
  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("nexttrack", next);
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("play", function () { au.play(); });
    navigator.mediaSession.setActionHandler("pause", function () { au.pause(); });
  }
  (async function () {
    if (!FS) { document.getElementById("empty").hidden = false; return; }
    try {
      base = (await FS.getUri({ path: "", directory: "DATA" })).uri.replace(/\/$/, "");
      var r = await FS.readFile({ path: "vz/index.json", directory: "DATA", encoding: "utf8" });
      items = JSON.parse(r.data) || [];
    } catch (e) { items = []; }
    render();
  })();
  // come back automatically when the network returns
  window.addEventListener("online", function () { setTimeout(retry, 800); });
</script>
</body>
</html>
